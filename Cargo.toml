[package]
name = "smash-launcher"
version = "0.1.0"
edition = "2021"
description = "Lightweight Minecraft launcher with account management"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
